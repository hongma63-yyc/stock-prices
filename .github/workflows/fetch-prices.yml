name: Fetch daily prices
on:
  schedule:
    - cron: '0 21 * * 1-5'      # weekdays, after US & TSX market close (GitHub often delays this)
  workflow_dispatch:            # lets you run it by hand too
  push:
    paths:
      - 'refresh.txt'           # Mac pokes this in the evening to fetch same-day close on demand
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - name: Fetch prices
        run: |
          python - <<'EOF'
          import yfinance as yf
          import pandas as pd
          import csv, time, sys

          CHUNK        = 100    # tickers per batched request
          SLEEP        = 3      # seconds between chunks
          RETRIES      = 3      # attempts per chunk
          MIN_COVERAGE = 0.80   # abort rather than commit a gutted file

          tickers = [t.strip() for t in open('tickers.txt')
                     if t.strip() and not t.startswith('#')]
          print(f"{len(tickers)} tickers, chunks of {CHUNK}")

          prices = {}   # ticker -> (close, date)

          def take(df, t):
              """Pull the last valid close out of a per-ticker frame."""
              try:
                  s = df['Close'].dropna()
                  if len(s):
                      return round(float(s.iloc[-1]), 4), s.index[-1].strftime('%Y-%m-%d')
              except Exception:
                  pass
              return None

          chunks = [tickers[i:i+CHUNK] for i in range(0, len(tickers), CHUNK)]
          for n, chunk in enumerate(chunks, 1):
              for attempt in range(1, RETRIES+1):
                  try:
                      data = yf.download(chunk, period='5d', group_by='ticker',
                                         auto_adjust=False, threads=False,
                                         progress=False)
                      if data is None or not len(data):
                          raise RuntimeError('empty frame')
                      for t in chunk:
                          try:
                              df = data[t] if len(chunk) > 1 else data
                          except KeyError:
                              continue
                          got = take(df, t)
                          if got:
                              prices[t] = got
                      print(f"  chunk {n}/{len(chunks)}: {len(prices)} priced so far")
                      break
                  except Exception as e:
                      wait = attempt * 10
                      print(f"  chunk {n} attempt {attempt} failed ({e}); retrying in {wait}s")
                      time.sleep(wait)
              else:
                  print(f"  chunk {n}: GAVE UP after {RETRIES} attempts")
              time.sleep(SLEEP)

          # Second pass: retry stragglers individually, in case a batch partially failed.
          missing = [t for t in tickers if t not in prices]
          if missing and len(missing) <= 150:
              print(f"retrying {len(missing)} stragglers individually")
              for t in missing:
                  try:
                      got = take(yf.Ticker(t).history(period='5d'), t)
                      if got:
                          prices[t] = got
                  except Exception:
                      pass
                  time.sleep(0.5)

          coverage = len(prices) / len(tickers) if tickers else 0
          print(f"\npriced {len(prices)}/{len(tickers)}  coverage={coverage:.1%}")

          # Throttling shows up as blank rows, not as an error. Refuse to overwrite a
          # good prices.csv with a gutted one — a stale file is safer than a hollow one.
          if coverage < MIN_COVERAGE:
              print(f"FATAL: coverage below {MIN_COVERAGE:.0%} — likely rate-limited.")
              print("Leaving the existing prices.csv untouched.")
              sys.exit(1)

          with open('prices.csv', 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['ticker', 'close', 'price_date'])
              for t in tickers:
                  c, d = prices.get(t, ('', ''))
                  w.writerow([t, c, d])
          print('Wrote', len(tickers), 'rows')
          EOF
      - name: Commit prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.csv
          git commit -m "Update prices" || { echo "no changes to commit"; exit 0; }
          # Pull-rebase + retry so a concurrent push (another workflow, the Mac
          # pusher, or a manual push) can't reject us with "fetch first".
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push race on attempt $i, retrying..."; sleep $((RANDOM % 8 + 3))
          done
          echo "push still failing after 5 attempts"; exit 1
